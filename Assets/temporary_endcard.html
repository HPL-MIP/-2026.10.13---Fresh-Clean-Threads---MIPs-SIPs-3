    <script>
      // MRAID v2.0 readiness guard. Keep this immediately after the bridge
      // declaration so every later MRAID call can use the same state check.
      (function () {
        let mraidIsReady = false;
        let mraidReadyListenerAttached = false;

        function trackMraidReadiness(mraid) {
          if (
            mraidReadyListenerAttached ||
            !mraid ||
            typeof mraid.addEventListener !== "function"
          ) {
            return;
          }

          try {
            mraid.addEventListener("ready", () => {
              mraidIsReady = true;
            });
            mraidReadyListenerAttached = true;
          } catch (_error) {
            // Non-standard preview bridges may throw here. getState() remains
            // the primary readiness signal in compliant MRAID containers.
          }
        }

        window.isMraidUsable = function (mraid) {
          if (!mraid) {
            return false;
          }

          trackMraidReadiness(mraid);

          // Minimal preview mocks sometimes omit getState().
          if (typeof mraid.getState !== "function") {
            return true;
          }

          try {
            const state = mraid.getState();
            return state === "default" || state === "expanded";
          } catch (_error) {
            return mraidIsReady;
          }
        };
      })();
    </script>

  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      height: 100%;
      /* iOS Safari auto-inflates small text on absolutely-positioned overlays
         even with the viewport meta. That breaks overlay position math, which
         caches text width before inflation. Pin to 100% to opt out. */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      /* dvh tracks the *visible* viewport on iOS Safari, so it stays in sync
         with window.innerHeight regardless of URL-bar state. vh is kept as a
         fallback for browsers that don't support dvh. Without this, on long
         phones (e.g. iPhone Pro Max) in landscape, 100vh = URL-bar-collapsed
         height while innerHeight = URL-bar-expanded height; the orientation
         workaround sizes the container off the smaller value and CSS renders
         it at the larger one, throwing the overlay's cover-fit math off. */
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #video-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    #video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

      // 16:9 is the target content frame used to compute fit workaround.
      const targetAspectRatio = 16 / 9;
      // Threshold for triggering extreme aspect-ratio compensation.
      const extremeRatioThreshold = 1.8;

      const video = document.getElementById("sip-video");
      const source = document.getElementById("sip-video-source");
      const container = document.getElementById("video-container");

      if (!video || !source || !container) {

      }

      video.addEventListener("playing", () => signalPlayableLifecycle("gameStart"), {

      video.addEventListener("ended", () => signalPlayableLifecycle("gameEnd"));

      // Handles clickthrough only after the MRAID bridge reaches an
      // interactive state. Browser previews log clicks without navigating.
      function handleClickAction() {
        const clickTarget =
          window.clickTag ||
          window.clickTag1 ||
          window.clickthrough ||
          window.clickThrough ||
          "";

        // Keep this canonical MRAID v2 click-through shape intact. Several
        // network validators scan the exported source instead of executing it,
        // so aliasing window.mraid or minifying this call can produce a false
        // "mraid present but no mraid.open()" rejection.
        if (
          typeof mraid !== "undefined" &&
          typeof mraid.open === "function" &&
          window.isMraidUsable(mraid)
        ) {
          try {
            if (clickTarget) {
              mraid.open(clickTarget);
            } else {
              mraid.open();
            }
            return;
          } catch (_error) {}
        }

        // Browser previews have no MRAID bridge and must not navigate.
        console.log("CTA_CLICKED");

      // Some iOS Safari environments do not consistently fire pointer events.

        const now = Date.now();
        if (now - lastTapAt < 500) {
          return;
        }

        if (
          event &&
          (event.type === "touchend" ||
            event.type === "pointerup" ||
            event.type === "click")
        ) {
          lastTapAt = now;
        }

        handleClickAction();

      function setContainerSize(widthPct, heightPct) {
        const width = `${widthPct}%`;
        const height = `${heightPct}%`;
        if (container.style.width !== width) {
          container.style.width = width;
        }
        if (container.style.height !== height) {
          container.style.height = height;

        // container that corrupts subsequent rotations.

          source.setAttribute("src", src);
